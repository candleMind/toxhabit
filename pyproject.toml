[project]
name = "toxhabit-inowj"
version = "0.1.0"
description = "I-NOWJ: Adaptive context selection and knowledge-guided learning for substance use NER"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "pyahocorasick>=2.3.0",
    "pytest>=9.0.2",
    "pytorch-crf>=0.7.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seqeval>=1.2.2",
    "torch>=2.10.0",
    "torchcrf>=1.1.0",
    "tqdm>=4.67.3",
    "transformers>=5.2.0",
    "wandb>=0.25.0",
]

[project.optional-dependencies]
augment = [
    "fasttext-wheel>=0.9.2",
    "spacy>=3.7.0",
]

[project.scripts]
augment = "augment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inowj", "src/augment"]
